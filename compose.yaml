services:
  llm-security-sender:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-security-sender:latest
    init: true
    restart: unless-stopped
    environment:
      API_ENDPOINT: ${API_ENDPOINT:-https://us.api.inspect.aidefense.security.cisco.com/api/v1/inspect/chat}
      POST_INTERVAL_SECONDS: ${POST_INTERVAL_SECONDS:-300}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-10}
      MESSAGE_MODE: ${MESSAGE_MODE:-random}
      MESSAGE_BATCH_SIZE: ${MESSAGE_BATCH_SIZE:-1}
      ALIGN_TO_HOUR: ${ALIGN_TO_HOUR:-false}
      AI_DEFENSE_API_KEY: ${AI_DEFENSE_API_KEY:?AI_DEFENSE_API_KEY must be set}
      EXTRA_HEADERS_JSON: ${EXTRA_HEADERS_JSON:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEALTH_STATUS_PATH: /app/health_status.json
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
